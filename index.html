<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1877f2;
        }
        p {
            color: #65676b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Xin chào thế giới!</h1>
        <p>Trang web của tôi đã chính thức hoạt động công khai.</p>
    </div>
</body>
</html>
